<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920, initial-scale=1" />
  <title>Horror Live Player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet" />
  <link rel="preload" as="image" href="/assets/ghost-hug.png" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; background: #000; overflow: hidden;
      font-family: "Segoe UI", Georgia, serif; color: #f2e8e0;
    }
    #stage {
      position: relative; width: 1080px; height: 1920px;
      max-width: 100vw; max-height: 100vh; margin: 0 auto;
      background: #000; overflow: hidden;
    }
    @media (max-aspect-ratio: 9/16) {
      #stage { width: 100vw; height: calc(100vw * 16 / 9); }
    }
    @media (min-aspect-ratio: 9/16) {
      #stage { height: 100vh; width: calc(100vh * 9 / 16); }
    }
    video {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; background: #000;
    }
    #idle { z-index: 1; }
    #scare {
      z-index: 2; opacity: 0; pointer-events: none;
      transition: opacity 0.35s ease;
    }
    #scare.visible { opacity: 1; }
    #vignette {
      position: absolute; inset: 0; z-index: 3; pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,0.55) 100%);
    }
    #caption {
      position: absolute; left: 50%; bottom: 12%; transform: translateX(-50%);
      z-index: 4; display: none; align-items: center; gap: 18px;
      padding: 14px 28px 14px 14px;
      background: linear-gradient(180deg, rgba(20,0,0,0.55), rgba(0,0,0,0.72));
      border: 1px solid rgba(180, 40, 40, 0.45); border-radius: 999px;
      box-shadow: 0 0 40px rgba(120, 0, 0, 0.35);
      backdrop-filter: blur(4px); max-width: 86%; opacity: 0;
      transition: opacity 0.5s ease;
    }
    #caption.show { display: flex; opacity: 1; }
    #caption img {
      width: 64px; height: 64px; border-radius: 50%; object-fit: cover;
      border: 2px solid rgba(220, 180, 180, 0.7); background: #222; flex-shrink: 0;
    }
    #caption .text {
      font-size: 28px; letter-spacing: 0.04em; line-height: 1.25;
      text-shadow: 0 2px 12px rgba(0,0,0,0.9), 0 0 18px rgba(160,0,0,0.45);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #caption .text em { font-style: italic; color: #e8cfcf; font-weight: 400; }
    #caption .text strong { color: #fff; font-weight: 600; }
    #click-unlock {
      position: absolute; inset: 0; z-index: 10; display: flex;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.72); cursor: pointer; text-align: center; padding: 40px;
    }
    #click-unlock.hidden { display: none; }
    #click-unlock .box {
      border: 1px solid rgba(180,60,60,0.5); padding: 36px 48px;
      border-radius: 12px; background: rgba(20,0,0,0.7); max-width: 80%;
    }
    #click-unlock h1 { font-size: 36px; margin-bottom: 12px; font-weight: 500; letter-spacing: 0.08em; }
    #click-unlock p { font-size: 22px; opacity: 0.85; line-height: 1.4; }
    #hud {
      position: absolute; top: 18px; left: 18px; z-index: 5;
      font-size: 14px; letter-spacing: 0.06em; opacity: 0.55;
      text-shadow: 0 1px 6px #000; pointer-events: none;
    }

    /* ---- Welcome: still of her hugging the viewer's framed portrait ----
       The rain/scare videos have no shot of her holding a photo. This is a
       layered still (body plate over the live avatar), not hugging footage. */
    #welcome {
      position: absolute; inset: 0; z-index: 6;
      container-type: size;
      display: flex; align-items: center; justify-content: center;
      pointer-events: none; opacity: 0;
      background: radial-gradient(ellipse at 50% 46%, rgba(0,0,0,0.05) 0%, rgba(0,0,0,0.58) 78%);
      transition: opacity 0.45s ease;
    }
    #welcome.show { opacity: 1; }
    #welcome.hide { opacity: 0; }
    .hug {
      width: 100%; height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 2% 3% 5%;
    }
    .hug-figure {
      position: relative;
      width: min(86%, 920px);
      opacity: 0;
      transform: translateY(28px) scale(1.035);
      filter: drop-shadow(0 28px 36px rgba(0,0,0,0.62));
    }
    #welcome.show .hug-figure {
      animation: hugIn 1.05s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    #welcome.hide .hug-figure {
      animation: hugOut 0.5s ease forwards;
    }
    @keyframes hugIn {
      0% { opacity: 0; transform: translateY(40px) scale(1.05); filter: drop-shadow(0 28px 36px rgba(0,0,0,0.62)) brightness(1.7); }
      22% { filter: drop-shadow(0 28px 36px rgba(0,0,0,0.62)) brightness(1.12); }
      100% { opacity: 1; transform: translateY(0) scale(1); filter: drop-shadow(0 28px 36px rgba(0,0,0,0.62)) brightness(1); }
    }
    @keyframes hugOut {
      to { opacity: 0; transform: translateY(16px) scale(0.985); }
    }
    .hug-girl {
      display: block; width: 100%; height: auto;
      position: relative; z-index: 2;
      pointer-events: none;
      user-select: none;
    }
    /* Opening measured from the keyed plate (percent of the PNG). */
    .hug-photo {
      position: absolute;
      z-index: 1;
      left: 25.35%;
      top: 49.52%;
      width: 49.62%;
      height: 35.71%;
      overflow: hidden;
      background: #120e10;
      box-shadow: inset 0 0 36px rgba(0,0,0,0.55), inset 0 0 8px rgba(0,0,0,0.85);
    }
    .hug-photo img {
      width: 100%; height: 100%; object-fit: cover; display: block;
      filter: contrast(1.06) saturate(0.9) brightness(0.92);
    }
    .hug-silhouette {
      position: absolute; inset: 0;
      background:
        radial-gradient(circle at 50% 36%, #4a4448 0 16%, transparent 17%),
        radial-gradient(ellipse at 50% 100%, #2c282b 0 52%, transparent 53%),
        radial-gradient(circle at 50% 42%, #1a1618, #070607 72%);
    }
    .hug-silhouette[hidden], .hug-photo img[hidden] { display: none !important; }
    .hug-name {
      margin-top: 0.6%;
      max-width: 88%;
      text-align: center;
      font-family: "Special Elite", Georgia, serif;
      font-size: 42px;
      font-size: 4.15cqw;
      line-height: 1.15;
      letter-spacing: 0.03em;
      color: #f4efe6;
      text-shadow:
        0 2px 2px rgba(0,0,0,0.95),
        0 6px 18px rgba(0,0,0,0.9),
        0 0 28px rgba(0,0,0,0.75);
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .hug-name[data-len="m"] { font-size: 36px; font-size: 3.45cqw; }
    .hug-name[data-len="l"] { font-size: 30px; font-size: 2.85cqw; }
    .hug-name[data-len="xl"] { font-size: 24px; font-size: 2.35cqw; }
    .lightning-flash {
      position: absolute; inset: 0; z-index: 7; pointer-events: none;
      background: rgba(220, 230, 255, 0.55); opacity: 0;
    }
    .lightning-flash.boom {
      animation: boom 0.35s ease-out;
    }
    @keyframes boom {
      0% { opacity: 0.85; }
      40% { opacity: 0.2; }
      55% { opacity: 0.55; }
      100% { opacity: 0; }
    }
  
    #like-toast {
      position: absolute; top: 8%; left: 50%; transform: translateX(-50%);
      z-index: 8; opacity: 0; pointer-events: none;
      font-family: "Special Elite", Georgia, serif;
      font-size: clamp(18px, 3.2vw, 34px);
      letter-spacing: 0.08em;
      color: #e8f0ff;
      text-shadow: 0 0 18px rgba(160,200,255,0.85), 0 2px 8px #000;
      transition: opacity 0.25s ease;
      white-space: nowrap;
    }
    #like-toast.show { opacity: 0.95; }
  </style>
</head>
<body>
  <div id="stage">
    <video id="idle" src="/videos/idle_loop_60s.mp4" muted playsinline loop preload="auto"></video>
    <video id="scare" src="/videos/scare_instant.mp4" playsinline preload="auto"></video>
    <div id="vignette"></div>
    <div id="welcome" aria-hidden="true">
      <div class="hug">
        <div class="hug-figure">
          <div class="hug-photo">
            <img id="welcome-avatar" alt="" hidden />
            <div class="hug-silhouette" id="welcome-silhouette"></div>
          </div>
          <img class="hug-girl" src="/assets/ghost-hug.png" alt="" />
        </div>
        <div class="hug-name" id="welcome-name">@viewer</div>
      </div>
    </div>
    <div class="lightning-flash" id="lightning"></div>
    <div id="like-toast"></div>
    <div id="caption">
      <img id="cap-avatar" alt="" />
      <div class="text" id="cap-text"></div>
    </div>
    <div id="hud"></div>
    <div id="click-unlock">
      <div class="box">
        <h1>CLICK TO START</h1>
        <p>Unlocks sound for the horror loop.<br/>In TikTok LIVE Studio, enable audio on this Browser source.</p>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const urlUser = (params.get('user') || params.get('u') || '').replace(/^@/, '').trim();

    const idle = document.getElementById('idle');
    const scare = document.getElementById('scare');
    const caption = document.getElementById('caption');
    const capAvatar = document.getElementById('cap-avatar');
    const capText = document.getElementById('cap-text');
    const unlock = document.getElementById('click-unlock');
    const hud = document.getElementById('hud');
    const welcome = document.getElementById('welcome');
    const welcomeAvatar = document.getElementById('welcome-avatar');
    const welcomeSilhouette = document.getElementById('welcome-silhouette');
    const welcomeName = document.getElementById('welcome-name');
    const lightning = document.getElementById('lightning');

    let cfg = {
      showCaption: true, idleVolume: 0.85, scareVolume: 1.0, idleVolumeDuringScare: 0.25
    };
    let unlocked = false;
    let scareActive = false;
    let scareEndTimer = null;
    // 'video' while a scare clip is playing. 'welcome' must ignore a late
    // 'ended' from that clip, or the hug is dismissed as soon as it appears.
    let scareMode = null;
    let audioCtx = null;

    ['/videos/idle_loop_60s.mp4','/videos/scare_instant.mp4','/videos/scare_buildup_20s.mp4']
      .forEach((src) => { const v = document.createElement('video'); v.preload='auto'; v.muted=true; v.src=src; v.load(); });

    function tryPlayIdle() {
      idle.loop = true;
      idle.volume = scareActive ? cfg.idleVolumeDuringScare : cfg.idleVolume;
      const p = idle.play();
      if (p && p.catch) p.catch(() => {});
    }

    function unlockAudio() {
      unlocked = true;
      unlock.classList.add('hidden');
      idle.muted = false;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
      } catch (_e) {}
      tryPlayIdle();
    }

    unlock.addEventListener('click', unlockAudio);
    document.addEventListener('pointerdown', () => { if (!unlocked) unlockAudio(); }, { once: true });

    idle.muted = true;
    tryPlayIdle();
    setTimeout(() => {
      idle.muted = false;
      idle.volume = cfg.idleVolume;
      const p = idle.play();
      if (p && p.then) {
        p.then(() => { unlocked = true; unlock.classList.add('hidden'); })
         .catch(() => { idle.muted = true; tryPlayIdle(); });
      }
    }, 300);

    function hideCaption() { caption.classList.remove('show'); }

    function showCaption(user, reason) {
      if (!cfg.showCaption) { hideCaption(); return; }
      const name = (user && (user.uniqueId || user.nickname)) || 'someone';
      let line = '';
      if (reason === 'join') line = `<strong>@${escapeHtml(name)}</strong> <em>walked into the storm…</em>`;
      else if (reason === 'rose') line = `<strong>@${escapeHtml(name)}</strong> <em>offered a rose…</em>`;
      else line = `<strong>@${escapeHtml(name)}</strong> <em>summoned her…</em>`;
      capText.innerHTML = line;
      if (user && user.profilePictureUrl) {
        capAvatar.style.display = 'block';
        capAvatar.src = '/api/avatar?url=' + encodeURIComponent(user.profilePictureUrl);
        capAvatar.onerror = () => { capAvatar.style.display = 'none'; };
      } else {
        capAvatar.style.display = 'none';
        capAvatar.removeAttribute('src');
      }
      caption.classList.add('show');
    }

    function escapeHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function playWhisper() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const duration = 2.4;
        const sampleRate = audioCtx.sampleRate;
        const buffer = audioCtx.createBuffer(1, sampleRate * duration, sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < data.length; i++) {
          const t = i / sampleRate;
          const env = Math.min(1, t * 2) * Math.max(0, 1 - (t / duration));
          data[i] = (Math.random() * 2 - 1) * 0.08 * env;
        }
        const src = audioCtx.createBufferSource();
        src.buffer = buffer;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.value = 1200;
        filter.Q.value = 0.7;
        const gain = audioCtx.createGain();
        gain.gain.value = 0.35;
        src.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        src.start();
      } catch (_e) {}
    }

    function hideWelcome() {
      welcome.classList.remove('show');
      welcome.classList.add('hide');
      welcome.setAttribute('aria-hidden', 'true');
      setTimeout(() => welcome.classList.remove('hide'), 700);
    }

    function setWelcomeName(name) {
      const label = '@' + name;
      welcomeName.textContent = label;
      // Prefer a large size that wraps to two lines over a tiny single line.
      const steps = ['s', 'm', 'l', 'xl'];
      for (const step of steps) {
        welcomeName.dataset.len = step;
        const lh = parseFloat(getComputedStyle(welcomeName).lineHeight) || 0;
        if (!lh || welcomeName.getBoundingClientRect().height <= lh * 2.2) break;
      }
    }

    function showWelcomeHug(payload) {
      const user = payload.user || {};
      const name = user.uniqueId || user.nickname || 'viewer';
      setWelcomeName(name);

      const proxy = payload.avatarProxy ||
        (user.profilePictureUrl ? '/api/avatar?url=' + encodeURIComponent(user.profilePictureUrl) : null);

      welcomeAvatar.onload = null;
      welcomeAvatar.onerror = null;
      welcomeAvatar.hidden = true;
      welcomeSilhouette.hidden = false;
      if (proxy) {
        welcomeAvatar.onload = () => {
          welcomeAvatar.hidden = false;
          welcomeSilhouette.hidden = true;
        };
        welcomeAvatar.onerror = () => {
          welcomeAvatar.hidden = true;
          welcomeSilhouette.hidden = false;
        };
        welcomeAvatar.src = proxy;
      } else {
        welcomeAvatar.removeAttribute('src');
      }

      idle.volume = cfg.idleVolumeDuringScare;
      hideCaption();
      welcome.classList.remove('hide');
      welcome.setAttribute('aria-hidden', 'false');
      // restart the entrance if a welcome was already showing
      welcome.classList.remove('show');
      void welcome.offsetWidth;
      welcome.classList.add('show');
      setTimeout(() => {
        lightning.classList.remove('boom');
        void lightning.offsetWidth;
        lightning.classList.add('boom');
      }, 180);
      playWhisper();
    }

    function endScare() {
      if (!scareActive) return;
      scareActive = false;
      scareMode = null;
      if (scareEndTimer) { clearTimeout(scareEndTimer); scareEndTimer = null; }
      scare.classList.remove('visible');
      try { scare.pause(); } catch (_e) {}
      hideCaption();
      hideWelcome();
      idle.volume = cfg.idleVolume;
      tryPlayIdle();
      if (socket && socket.connected) socket.emit('scare_finished');
    }

    function playVideoScare(payload) {
      const src = payload.video || '/videos/scare_instant.mp4';
      const abs = new URL(src, location.origin).pathname;
      const current = scare.getAttribute('data-src') || '';
      if (current !== abs) {
        scare.src = src;
        scare.setAttribute('data-src', abs);
        scare.load();
      }
      scare.currentTime = 0;
      scare.volume = cfg.scareVolume;
      scare.muted = false;
      idle.volume = cfg.idleVolumeDuringScare;
      if (payload.reason !== 'join_welcome') showCaption(payload.user, payload.reason);

      const start = () => {
        scare.classList.add('visible');
        const p = scare.play();
        if (p && p.catch) {
          p.catch(() => {
            // Pausing the clip for the welcome rejects this play(). Do not
            // restart it or end the hug.
            if (scareMode !== 'video') return;
            scare.muted = true;
            scare.play().catch(() => { if (scareMode === 'video') endScare(); });
          });
        }
      };
      if (scare.readyState >= 2) start();
      else {
        const onReady = () => { scare.removeEventListener('canplay', onReady); start(); };
        scare.addEventListener('canplay', onReady);
        setTimeout(() => { scare.removeEventListener('canplay', onReady); if (scareActive) start(); }, 1500);
      }
    }

    function playScare(payload) {
      if (scareActive) endScare();
      scareActive = true;
      hideWelcome();

      if (payload.type === 'welcome') {
        scareMode = 'welcome';
        try { scare.pause(); } catch (_e) {}
        scare.classList.remove('visible');
        showWelcomeHug(payload);
        if (scareEndTimer) clearTimeout(scareEndTimer);
        scareEndTimer = setTimeout(() => { if (scareActive) endScare(); }, 5000);
        return;
      }

      scareMode = 'video';
      playVideoScare(payload);
      const expectedMs = payload.type === 'buildup' ? 20500 : 3800;
      if (scareEndTimer) clearTimeout(scareEndTimer);
      scareEndTimer = setTimeout(() => { if (scareActive) endScare(); }, expectedMs + 800);
    }

    scare.addEventListener('ended', () => { if (scareMode === 'video') endScare(); });
    scare.addEventListener('error', () => { if (scareMode === 'video') endScare(); });
    idle.addEventListener('ended', () => { idle.currentTime = 0; tryPlayIdle(); });
    idle.addEventListener('pause', () => { if (!document.hidden) tryPlayIdle(); });

    function setHud(conn) {
      if (conn && conn.state === 'connected' && conn.username) {
        hud.textContent = 'LIVE';
      } else {
        hud.textContent = '';
      }
    }

    const socket = io({ transports: ['websocket', 'polling'] });
    socket.on('connect', () => {
      if (urlUser) {
        socket.emit('connect_tiktok', { username: urlUser }, (res) => {
          if (res && res.connection) setHud(res.connection);
        });
      }
    });
    socket.on('config', (c) => {
      cfg = Object.assign(cfg, c || {});
      if (!scareActive) idle.volume = cfg.idleVolume;
    });
    socket.on('status', (s) => setHud(s && s.connection));
    const likeToast = document.getElementById('like-toast');
    let likeToastTimer = null;
    function thunderCrack() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const t0 = audioCtx.currentTime;
        const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.5, audioCtx.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < d.length; i++) {
          const env = Math.pow(1 - i / d.length, 2.2);
          d[i] = (Math.random() * 2 - 1) * env;
        }
        const src = audioCtx.createBufferSource();
        src.buffer = buf;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 180;
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.55, t0);
        gain.gain.exponentialRampToValueAtTime(0.01, t0 + 0.45);
        src.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
        src.start();
      } catch (_e) {}
    }
    socket.on('like_flash', (payload) => {
      const name = (payload && payload.user && (payload.user.uniqueId || payload.user.nickname)) || 'viewer';
      if (likeToast) {
        likeToast.textContent = '@' + name + ' ⚡';
        likeToast.classList.add('show');
        if (likeToastTimer) clearTimeout(likeToastTimer);
        likeToastTimer = setTimeout(() => likeToast.classList.remove('show'), 1200);
      }
      if (lightning) {
        lightning.classList.remove('boom');
        void lightning.offsetWidth;
        lightning.classList.add('boom');
      }
      // brief idle flicker via CSS filter on stage
      const stage = document.getElementById('stage');
      if (stage) {
        stage.style.filter = 'brightness(1.35) contrast(1.1)';
        setTimeout(() => { stage.style.filter = ''; }, 120);
        setTimeout(() => { stage.style.filter = 'brightness(0.85)'; setTimeout(()=>{ stage.style.filter=''; }, 80); }, 160);
      }
      thunderCrack();
    });
    socket.on('scare', (payload) => playScare(payload));
  </script>
</body>
</html>
